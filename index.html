<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Finanças (60/20/10/10)</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --text-muted: #4b5563;
            --border-color: #d1d5db;
            --result-bg: #f9fafb;
        }

        [data-theme="dark"] {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #111827;
            --card-bg: #1f2937;
            --text-color: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: #374151;
            --result-bg: #111827;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        .calculator-container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 500px;
            transition: background-color 0.3s;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h2 {
            margin: 0;
            color: var(--primary-color);
            font-size: 1.4rem;
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .theme-toggle:hover {
            background-color: var(--border-color);
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus, input[type="text"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .alert-box {
            background-color: #fee2e2;
            color: #b91c1c;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 15px;
            display: none;
            font-weight: 600;
        }

        .goal-section {
            background-color: var(--result-bg);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        .goal-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .progress-bar-bg {
            background-color: var(--border-color);
            border-radius: 4px;
            height: 8px;
            width: 100%;
            overflow: hidden;
        }

        .progress-bar-fill {
            background-color: #10b981;
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }

        .goal-input-container {
            display: flex;
            gap: 10px;
            margin-top: 8px;
            align-items: center;
        }

        .goal-input-container label {
            font-size: 0.8rem;
            margin: 0;
            white-space: nowrap;
        }

        .goal-input-container input {
            padding: 6px;
            font-size: 0.9rem;
        }

        .chart-container {
            position: relative;
            width: 100%;
            max-width: 220px;
            margin: 0 auto 15px auto;
            height: 180px;
        }

        .results {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .result-card {
            background-color: var(--result-bg);
            border-left: 5px solid #4f46e5;
            padding: 12px 15px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 1rem;
        }

        .result-card:nth-child(1) { border-left-color: #4f46e5; }
        .result-card:nth-child(2) { border-left-color: #10b981; }
        .result-card:nth-child(3) { border-left-color: #f59e0b; }
        .result-card:nth-child(4) { border-left-color: #ef4444; }

        .result-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .label-input {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-weight: bold;
            font-size: 0.95rem;
            width: 60%;
            outline: none;
        }

        .value {
            font-weight: 700;
            color: var(--text-color);
        }

        /* Campo de Notas Opcionais por Categoria */
        .note-input {
            width: 100%;
            padding: 6px 10px;
            font-size: 0.85rem;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-color);
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .note-input:focus {
            border-color: var(--primary-color);
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }

        .btn-primary { background-color: var(--primary-color); color: white; }
        .btn-secondary { background-color: var(--border-color); color: var(--text-color); }

        .history-section {
            margin-top: 25px;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .history-header h3 { font-size: 1rem; margin: 0; color: var(--text-muted); }
        .clear-history { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 0.85rem; }

        .history-list {
            max-height: 140px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.85rem;
        }

        .history-item {
            background-color: var(--result-bg);
            padding: 8px 12px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            cursor: pointer;
            transition: background 0.2s;
        }

        .history-item:hover {
            background-color: var(--border-color);
            color: var(--text-color);
        }

        .evolution-section {
            margin-top: 20px;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }
        .evolution-container {
            position: relative;
            width: 100%;
            height: 150px;
            margin-top: 10px;
        }
    </style>
</head>
<body data-theme="light">

    <div class="calculator-container">
        <div class="header-top">
            <h2>Gestão 60/20/10/10</h2>
            <button class="theme-toggle" onclick="toggleTheme()">🌙 Tema</button>
        </div>
        
        <div class="input-group">
            <label for="valorTotal">Valor Total Disponível (R$):</label>
            <input type="number" id="valorTotal" placeholder="Ex: 3000.00" step="0.01" oninput="calcularDivisao()">
        </div>

        <div id="alertBox" class="alert-box">⚠️ Por favor, insira um valor válido maior que zero.</div>

        <div class="goal-section">
            <div class="goal-header">
                <span id="goalTitleText">Meta de Investimento:</span>
                <span id="goalProgressText">R$ 0,00 / R$ 0,00 (0%)</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="goalProgressBar"></div>
            </div>
            <div class="goal-input-container">
                <label for="metaInput">Definir Meta (R$):</label>
                <input type="number" id="metaInput" placeholder="Ex: 1000.00" step="0.01" oninput="atualizarMeta()">
            </div>
        </div>

        <div class="chart-container">
            <canvas id="financeChart"></canvas>
        </div>

        <div class="results">
            <!-- Categoria 1 -->
            <div class="result-card">
                <div class="result-header-row">
                    <input type="text" class="label-input" value="60% - Custos Fixos" oninput="atualizarGrafico()">
                    <span class="value" id="res60">R$ 0,00</span>
                </div>
                <input type="text" class="note-input" id="note60" placeholder="Anotar gastos (ex: Aluguel, contas...)">
            </div>
            <!-- Categoria 2 -->
            <div class="result-card">
                <div class="result-header-row">
                    <input type="text" class="label-input" value="20% - Investimentos" oninput="atualizarGrafico()">
                    <span class="value" id="res20">R$ 0,00</span>
                </div>
                <input type="text" class="note-input" id="note20" placeholder="Anotar onde vai investir...">
            </div>
            <!-- Categoria 3 -->
            <div class="result-card">
                <div class="result-header-row">
                    <input type="text" class="label-input" value="10% - Objetivos/Lazer" oninput="atualizarGrafico()">
                    <span class="value" id="res10a">R$ 0,00</span>
                </div>
                <input type="text" class="note-input" id="note10a" placeholder="Anotar lazer (ex: Passeio, cinema...)">
            </div>
            <!-- Categoria 4 -->
            <div class="result-card">
                <div class="result-header-row">
                    <input type="text" class="label-input" value="10% - Doações/Outros" oninput="atualizarGrafico()">
                    <span class="value" id="res10b">R$ 0,00</span>
                </div>
                <input type="text" class="note-input" id="note10b" placeholder="Anotar outros gastos...">
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-primary" onclick="copiarResumo()">📋 Copiar Resumo</button>
            <button class="btn btn-secondary" onclick="salvarHistorico()">💾 Salvar</button>
        </div>

        <div class="history-section">
            <div class="history-header">
                <h3>Histórico Salvo (Toque para ver)</h3>
                <button class="clear-history" onclick="limparHistorico()">Limpar</button>
            </div>
            <div class="history-list" id="historyList">
                <div style="color: var(--text-muted); text-align: center;">Nenhum cálculo salvo ainda.</div>
            </div>
        </div>

        <div class="evolution-section">
            <div class="history-header">
                <h3>Evolução dos Valores Salvos</h3>
            </div>
            <div class="evolution-container">
                <canvas id="evolutionChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
            });
        }

        let financeChart, evolutionChart;

        function initCharts() {
            const ctxPie = document.getElementById('financeChart').getContext('2d');
            financeChart = new Chart(ctxPie, {
                type: 'doughnut',
                data: {
                    labels: ['60%', '20%', '10%', '10%'],
                    datasets: [{
                        data: [0, 0, 0, 0],
                        backgroundColor: ['#4f46e5', '#10b981', '#f59e0b', '#ef4444'],
                        borderWidth: 0
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });

            const ctxLine = document.getElementById('evolutionChart').getContext('2d');
            evolutionChart = new Chart(ctxLine, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Total Salvo (R$)',
                        data: [],
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true } }
                }
            });
        }

        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            body.setAttribute('data-theme', newTheme);
            document.querySelector('.theme-toggle').innerText = newTheme === 'light' ? '🌙 Tema' : '☀️ Tema';
        }

        function formatarMoeda(num) {
            return num.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function calcularDivisao() {
            const inputValor = document.getElementById('valorTotal').value;
            const valor = parseFloat(inputValor);
            const alertBox = document.getElementById('alertBox');

            if (inputValor !== "" && (isNaN(valor) || valor < 0)) {
                alertBox.style.display = 'block';
                zerarResultados();
                return;
            } else {
                alertBox.style.display = 'none';
            }

            if (isNaN(valor) || valor <= 0) {
                zerarResultados();
                return;
            }

            const val60 = valor * 0.60;
            const val20 = valor * 0.20;
            const val10 = valor * 0.10;

            document.getElementById('res60').innerText = formatarMoeda(val60);
            document.getElementById('res20').innerText = formatarMoeda(val20);
            document.getElementById('res10a').innerText = formatarMoeda(val10);
            document.getElementById('res10b').innerText = formatarMoeda(val10);

            atualizarGrafico(val60, val20, val10, val10);
            atualizarMeta();
        }

        function zerarResultados() {
            document.getElementById('res60').innerText = 'R$ 0,00';
            document.getElementById('res20').innerText = 'R$ 0,00';
            document.getElementById('res10a').innerText = 'R$ 0,00';
            document.getElementById('res10b').innerText = 'R$ 0,00';
            atualizarGrafico(0, 0, 0, 0);
            atualizarMeta(0);
        }

        function atualizarGrafico(v60 = 0, v20 = 0, v10a = 0, v10b = 0) {
            const inputValor = parseFloat(document.getElementById('valorTotal').value) || 0;
            if (inputValor > 0 && v60 === 0) {
                v60 = inputValor * 0.60;
                v20 = inputValor * 0.20;
                v10a = inputValor * 0.10;
                v10b = inputValor * 0.10;
            }

            const labels = Array.from(document.querySelectorAll('.label-input')).map(i => i.value);
            financeChart.data.labels = labels;
            financeChart.data.datasets[0].data = [v60, v20, v10a, v10b];
            financeChart.update();
        }

        function atualizarMeta() {
            const valorTotal = parseFloat(document.getElementById('valorTotal').value) || 0;
            const val20 = valorTotal * 0.20;
            const metaValor = parseFloat(document.getElementById('metaInput').value) || 0;

            const nomeCategoria2 = document.querySelectorAll('.label-input')[1].value;
            document.getElementById('goalTitleText').innerText = `Meta (${nomeCategoria2}):`;

            let porcentagem = 0;
            if (metaValor > 0) {
                porcentagem = Math.min((val20 / metaValor) * 100, 100);
            }

            document.getElementById('goalProgressText').innerText = `${formatarMoeda(val20)} / ${formatarMoeda(metaValor)} (${porcentagem.toFixed(0)}%)`;
            document.getElementById('goalProgressBar').style.width = `${porcentagem}%`;
        }

        function copiarResumo() {
            const total = document.getElementById('valorTotal').value;
            if (!total || total <= 0) { alert('Insira um valor válido primeiro!'); return; }

            const labels = Array.from(document.querySelectorAll('.label-input')).map(i => i.value);
            const valores = [
                document.getElementById('res60').innerText,
                document.getElementById('res20').innerText,
                document.getElementById('res10a').innerText,
                document.getElementById('res10b').innerText
            ];
            const notas = [
                document.getElementById('note60').value,
                document.getElementById('note20').value,
                document.getElementById('note10a').value,
                document.getElementById('note10b').value
            ];

            let texto = `*Planejamento Financeiro*\nTotal: ${formatarMoeda(parseFloat(total))}\n\n`;
            labels.forEach((l, i) => { 
                texto += `• ${l}: ${valores[i]}`;
                if(notas[i]) texto += ` (${notas[i]})`;
                texto += `\n`; 
            });

            navigator.clipboard.writeText(texto).then(() => alert('Resumo copiado com as anotações!'));
        }

        function salvarHistorico() {
            const total = document.getElementById('valorTotal').value;
            if (!total || total <= 0) { alert('Insira um valor válido para salvar!'); return; }

            const dataAtual = new Date().toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
            const itemHistorico = {
                data: dataAtual,
                valorBruto: parseFloat(total),
                valorFormatado: formatarMoeda(parseFloat(total)),
                notas: {
                    n60: document.getElementById('note60').value,
                    n20: document.getElementById('note20').value,
                    n10a: document.getElementById('note10a').value,
                    n10b: document.getElementById('note10b').value
                }
            };

            let historico = JSON.parse(localStorage.getItem('fin_historico')) || [];
            historico.unshift(itemHistorico);
            if (historico.length > 10) historico.pop();

            localStorage.setItem('fin_historico', JSON.stringify(historico));
            carregarHistorico();
           atualizarGraficoEvolucao();
            alert('Cálculo e anotações salvos no histórico!');
        }

        function carregarHistorico() {
            const historyList = document.getElementById('historyList');
            let historico = JSON.parse(localStorage.getItem('fin_historico')) || [];

            if (historico.length === 0) {
                historyList.innerHTML = `<div style="color: var(--text-muted); text-align: center;">Nenhum cálculo salvo ainda.</div>`;
                return;
            }

            historyList.innerHTML = '';
            historico.forEach((item, index) => {
                historyList.innerHTML += `<div class="history-item" onclick="carregarCalculoSalvo(${index})">
                        <span>📅 ${item.data}</span>
                        <strong>${item.valorFormatado}</strong>
                    </div>
                `;
            });
        }

        function carregarCalculoSalvo(index) {
            let historico = JSON.parse(localStorage.getItem('fin_historico')) || [];
            if (historico[index]) {
                document.getElementById('valorTotal').value = historico[index].valorBruto;
                
                // Restaura as notas se existirem salvas
                if (historico[index].notas) {
                    document.getElementById('note60').value = historico[index].notas.n60 || '';
                    document.getElementById('note20').value = historico[index].notas.n20 || '';
                    document.getElementById('note10a').value = historico[index].notas.n10a || '';
                    document.getElementById('note10b').value = historico[index].notas.n10b || '';
                }

                calcularDivisao();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function atualizarGraficoEvolucao() {
            let historico = JSON.parse(localStorage.getItem('fin_historico')) || [];
            let historicoCronologico = [...historico].reverse();

            evolutionChart.data.labels = historicoCronologico.map(i => i.data);
            evolutionChart.data.datasets[0].data = historicoCronologico.map(i => i.valorBruto);
            evolutionChart.update();
        }
   function limparHistorico() {
            localStorage.removeItem('fin_historico');
            carregarHistorico();
            atualizarGraficoEvolucao();
        }

        window.onload = function() {
            initCharts();
            carregarHistorico();
            atualizarGraficoEvolucao();
        };
    </script>
</body>
</html>
