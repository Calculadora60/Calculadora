<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Finanças (60/20/10/10)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --text-muted: #4b5563;
            --border-color: #d1d5db;
            --result-bg: #f9fafb;
        }

        [data-theme="dark"] {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #111827;
            --card-bg: #1f2937;
            --text-color: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: #374151;
            --result-bg: #111827;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        .calculator-container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 500px;
            transition: background-color 0.3s;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h2 {
            margin: 0;
            color: var(--primary-color);
            font-size: 1.4rem;
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .theme-toggle:hover {
            background-color: var(--border-color);
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        /* Área do Alerta de Erro */
        .alert-box {
            background-color: #fee2e2;
            color: #b91c1c;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 15px;
            display: none;
            font-weight: 600;
        }

        /* Container do Gráfico */
        .chart-container {
            position: relative;
            width: 100%;
            max-width: 250px;
            margin: 0 auto 20px auto;
            height: 200px;
        }

        .results {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .result-card {
            background-color: var(--result-bg);
            border-left: 5px solid #4f46e5;
            padding: 12px 15px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1rem;
            transition: background-color 0.3s;
        }

        .result-card:nth-child(1) { border-left-color: #4f46e5; }
        .result-card:nth-child(2) { border-left-color: #10b981; }
        .result-card:nth-child(3) { border-left-color: #f59e0b; }
        .result-card:nth-child(4) { border-left-color: #ef4444; }

        .label-input {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-weight: bold;
            font-size: 0.95rem;
            width: 60%;
            outline: none;
            border-bottom: 1px dashed transparent;
            transition: border-color 0.2s;
        }

        .label-input:focus {
            border-bottom-color: var(--primary-color);
            background-color: rgba(0,0,0,0.03);
            border-radius: 4px;
            padding: 2px;
        }

        .value {
            font-weight: 700;
            color: var(--text-color);
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: var(--border-color);
            color: var(--text-color);
        }

        .btn-secondary:hover {
            opacity: 0.8;
        }

        /* Histórico */
        .history-section {
            margin-top: 30px;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .history-header h3 {
            font-size: 1rem;
            margin: 0;
            color: var(--text-muted);
        }

        .clear-history {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .history-list {
            max-height: 150px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.85rem;
        }

        .history-item {
            background-color: var(--result-bg);
            padding: 8px 12px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
        }
    </style>
</head>
<body data-theme="light">

    <div class="calculator-container">
        <div class="header-top">
            <h2>Gestão 60/20/10/10</h2>
            <button class="theme-toggle" onclick="toggleTheme()">🌙 Tema</button>
        </div>
        
        <div class="input-group">
            <label for="valorTotal">Valor Total Disponível (R$):</label>
            <input type="number" id="valorTotal" placeholder="Ex: 3000.00" step="0.01" oninput="calcularDivisao()">
        </div>

        <div id="alertBox" class="alert-box">⚠️ Por favor, insira um valor válido maior que zero (sem números negativos).</div>

        <div class="chart-container">
            <canvas id="financeChart"></canvas>
        </div>

        <div class="results">
            <div class="result-card">
                <input type="text" class="label-input" value="60% - Custos Fixos" oninput="atualizarGrafico()">
                <span class="value" id="res60">R$ 0,00</span>
            </div>
            <div class="result-card">
                <input type="text" class="label-input" value="20% - Investimentos" oninput="atualizarGrafico()">
                <span class="value" id="res20">R$ 0,00</span>
            </div>
            <div class="result-card">
                <input type="text" class="label-input" value="10% - Objetivos/Lazer" oninput="atualizarGrafico()">
                <span class="value" id="res10a">R$ 0,00</span>
            </div>
            <div class="result-card">
                <input type="text" class="label-input" value="10% - Doações/Outros" oninput="atualizarGrafico()">
                <span class="value" id="res10b">R$ 0,00</span>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-primary" onclick="copiarResumo()">📋 Copiar Resumo</button>
            <button class="btn btn-secondary" onclick="salvarHistorico()">💾 Salvar</button>
        </div>

        <div class="history-section">
            <div class="history-header">
                <h3>Histórico Salvo</h3>
                <button class="clear-history" onclick="limparHistorico()">Limpar</button>
            </div>
            <div class="history-list" id="historyList">
                <div style="color: var(--text-muted); text-align: center;">Nenhum cálculo salvo ainda.</div>
            </div>
        </div>
    </div>

    <script>
        let financeChart;

        // Inicializar o Gráfico
        function initChart() {
            const ctx = document.getElementById('financeChart').getContext('2d');
            financeChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['60%', '20%', '10%', '10%'],
                    datasets: [{
                        data: [0, 0, 0, 0],
                        backgroundColor: ['#4f46e5', '#10b981', '#f59e0b', '#ef4444'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });
        }

        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            body.setAttribute('data-theme', newTheme);
            document.querySelector('.theme-toggle').innerText = newTheme === 'light' ? '🌙 Tema' : '☀️ Tema';
        }

        function formatarMoeda(num) {
            return num.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function calcularDivisao() {
            const inputValor = document.getElementById('valorTotal').value;
            const valor = parseFloat(inputValor);
            const alertBox = document.getElementById('alertBox');

            // Validação de erro e saldo negativo
            if (inputValor !== "" && (isNaN(valor) || valor < 0)) {
                alertBox.style.display = 'block';
                alertBox.innerText = '⚠️ Atenção: Não são permitidos valores negativos ou inválidos.';
                zerarResultados();
                return;
            } else {
                alertBox.style.display = 'none';
            }

            if (isNaN(valor) || valor <= 0) {
                zerarResultados();
                return;
            }

            const val60 = valor * 0.60;
            const val20 = valor * 0.20;
            const val10 = valor * 0.10;

            document.getElementById('res60').innerText = formatarMoeda(val60);
            document.getElementById('res20').innerText = formatarMoeda(val20);
            document.getElementById('res10a').innerText = formatarMoeda(val10);
            document.getElementById('res10b').innerText = formatarMoeda(val10);

            // Atualiza o gráfico com os novos valores reais
            atualizarGrafico(val60, val20, val10, val10);
        }

        function zerarResultados() {
            document.getElementById('res60').innerText = 'R$ 0,00';
            document.getElementById('res20').innerText = 'R$ 0,00';
            document.getElementById('res10a').innerText = 'R$ 0,00';
            document.getElementById('res10b').innerText = 'R$ 0,00';
            atualizarGrafico(0, 0, 0, 0);
        }

        function atualizarGrafico(v60 = 0, v20 = 0, v10a = 0, v10b = 0) {
            // Se os valores não foram passados diretamente, recalcula
            const inputValor = parseFloat(document.getElementById('valorTotal').value) || 0;
            if (inputValor > 0 && v60 === 0) {
                v60 = inputValor * 0.60;
                v20 = inputValor * 0.20;
                v10a = inputValor * 0.10;
                v10b = inputValor * 0.10;
            }

            // Pega os rótulos dinâmicos para atualizar a legenda mental do gráfico
            const l1 = document.querySelectorAll('.label-input')[0].value;
            const l2 = document.querySelectorAll('.label-input')[1].value;
            const l3 = document.querySelectorAll('.label-input')[2].value;
            const l4 = document.querySelectorAll('.label-input')[3].value;

            financeChart.data.labels = [l1, l2, l3, l4];
            financeChart.data.datasets[0].data = [v60, v20, v10a, v10b];
            financeChart.update();
        }

        function copiarResumo() {
            const total = document.getElementById('valorTotal').value;
            if (!total || total <= 0) {
                alert('Insira um valor válido primeiro!');
                return;
            }

            const l1 = document.querySelectorAll('.label-input')[0].value;
            const l2 = document.querySelectorAll('.label-input')[1].value;
            const l3 = document.querySelectorAll('.label-input')[2].value;
            const l4 = document.querySelectorAll('.label-input')[3].value;

            const v1 = document.getElementById('res60').innerText;
            const v2 = document.getElementById('res20').innerText;
            const v3 = document.getElementById('res10a').innerText;
            const v4 = document.getElementById('res10b').innerText;

            const texto = `*Planejamento Financeiro*\n` +
                          `Total: ${formatarMoeda(parseFloat(total))}\n\n` +
                          `• ${l1}: ${v1}\n` +
                          `• ${l2}: ${v2}\n` +
                          `• ${l3}: ${v3}\n` +
                          `• ${l4}: ${v4}`;

            navigator.clipboard.writeText(texto).then(() => {
                alert('Resumo copiado para a área de transferência!');
            });
        }

        function salvarHistorico() {
            const total = document.getElementById('valorTotal').value;
            if (!total || total <= 0) {
                alert('Insira um valor válido para salvar!');
                return;
            }

            const dataAtual = new Date().toLocaleDateString('pt-BR');
            const itemHistorico = {
                data: dataAtual,
                valor: formatarMoeda(parseFloat(total))
            };

            let historico = JSON.parse(localStorage.getItem('fin_historico')) || [];
            historico.unshift(itemHistorico);
            if (historico.length > 10) historico.pop();

            localStorage.setItem('fin_historico', JSON.stringify(historico));
            carregarHistorico();
            alert('Cálculo salvo no histórico!');
        }

        function carregarHistorico() {
            const historyList = document.getElementById('historyList');
            let historico = JSON.parse(localStorage.getItem('fin_historico')) || [];

            if (historico.length === 0) {
                historyList.innerHTML = `<div style="color: var(--text-muted); text-align: center;">Nenhum cálculo salvo ainda.</div>`;
                return;
            }

            historyList.innerHTML = '';
            historico.forEach(item => {
                historyList.innerHTML += `
                    <div class="history-item">
                        <span>${item.data}</span>
                        <strong>${item.valor}</strong>
                    </div>
                `;
            });
        }

        function limparHistorico() {
            localStorage.removeItem('fin_historico');
            carregarHistorico();
        }

        // Inicializa o gráfico e histórico ao carregar a página
        window.onload = function() {
            initChart();
            carregarHistorico();
        };
    </script>

</body>
</html>
